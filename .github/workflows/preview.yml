name: Preview

# Preview kanál Firebase Hosting pro každý PR (vyprší za 7 dní, odkaz přijde jako komentář).
# Pozor: preview míří na ostrý backend. Neregistruj v něm skutečná data.
# Vyžaduje GitHub Secret FIREBASE_SERVICE_ACCOUNT (účet s rolí Firebase Hosting Admin), nastavuje Radek.
on:
  pull_request:

jobs:
  preview:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      checks: write
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: navigator-pece
          expires: 7d
